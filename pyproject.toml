[project]
name = "chart-qa-workshop"
version = "0.2.0"
description = "Northfield Health chart Q&A workshop lab (synthetic data) on LangChain, LangGraph and LangSmith: build RAG, evaluate, improve, agent, observe."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain==1.3.14",
    "langchain-core==1.5.2",
    "langchain-openai==1.4.1",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.3",
    "langchain-chroma==1.1.0",
    "chromadb==1.5.9",
    "langgraph==1.2.10",
    "deepagents==0.6.12",
    "langsmith==0.10.12",
    "openevals==0.2.2",
    "langgraph-cli[inmem]==0.4.31",
    "jupyter==1.1.1",
    "nbconvert==7.17.1",
    "nbclient==0.11.0",
    "ipykernel==7.3.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false
